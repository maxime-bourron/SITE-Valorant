<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant - Statistiques</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/stats.css">
</head>
<body>
    <header>
        <h1>Statistiques de Valorant</h1>
        <p>Entrez les résultats de vos parties pour suivre vos performances.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="maps.html">Cartes</a></li>
            <li><a href="stats.html">Statistiques</a></li>
            <li><a href="inscription.html">Inscription</a></li>
            <li><a href="connexion.html">Connexion</a></li>
        </ul>
    </nav>

    <main>
        <form id="stats-form">
            <div class="column">
                <label for="result">Résultat :</label>
                <select id="result" name="result">
                    <option value="Victoire">Victoire</option>
                    <option value="Défaite">Défaite</option>
                    <option value="Match nul">Match nul</option>
                </select>

                <label for="roundwin">Manches Gagnées :</label>
                <input type="number" id="roundwin" name="roundwin" min="0" step="1">

                <label for="roundlose">Manches Perdus :</label>
                <input type="number" id="roundlose" name="roundlose" min="0" step="1">

                <label for="agent">Agent joué :</label>
                <select id="agent" name="agent">
                    <option value="Jett">Jett</option>
                    <option value="Raze">Raze</option>
                    <option value="Breach">Breach</option>
                    <option value="Omen">Omen</option>
                    <option value="Brimstone">Brimstone</option>
                    <option value="Phoenix">Phoenix</option>
                    <option value="Sage">Sage</option>
                    <option value="Sova">Sova</option>
                    <option value="Viper">Viper</option>
                    <option value="Cypher">Cypher</option>
                    <option value="Reyna">Reyna</option>
                    <option value="Killjoy">Killjoy</option>
                    <option value="Skye">Skye</option>
                    <option value="Yoru">Yoru</option>
                    <option value="Astra">Astra</option>
                    <option value="Kay/o">Kay/o</option>
                    <option value="Chamber">Chamber</option>
                    <option value="Neon">Neon</option>
                    <option value="Fade">Fade</option>
                    <option value="Harbor">Harbor</option>
                    <option value="Gekko">Gekko</option>
                    <option value="Deadlock">Deadlock</option>
                    <option value="Iso">Iso</option>
                    <option value="Clove">Clove</option>
                </select>
            </div>

            <div class="column">
                <label for="kills">Kills :</label>
                <input type="number" id="kills" name="kills" min="0" step="1">

                <label for="deaths">Morts :</label>
                <input type="number" id="deaths" name="deaths" min="0" step="1">

                <label for="assists">Assists :</label>
                <input type="number" id="assists" name="assists" min="0" step="1">

                <label for="map">Carte jouée :</label>
                <select id="map" name="map">
                    <option value="Sunset">Sunset</option>
                    <option value="Lotus">Lotus</option>
                    <option value="Pearl">Pearl</option>
                    <option value="Fracture">Fracture</option>
                    <option value="Icebox">Icebox</option>
                    <option value="Bind">Bind</option>
                    <option value="Haven">Haven</option>
                    <option value="Split">Split</option>
                    <option value="Ascent">Ascent</option>
                    <option value="Breeze">Breeze</option>
                </select>
            </div>

            <button type="submit">Soumettre</button>
        </form>

        <section class="stats-section">
            <h2>Statistiques</h2>
            <div id="stats-container">
                <div class="kills-bar">
                    <label for="kills-progress">Kills :</label>
                    <progress id="kills-progress" max="100" value="0"></progress>
                </div>
                <div class="deaths-bar">
                    <label for="deaths-progress">Morts :</label>
                    <progress id="deaths-progress" max="100" value="0"></progress>
                </div>
            </div>
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Résultat</th>
                        <th>Manches Gagnées</th>
                        <th>Manches Perdues</th>
                        <th>Kills</th>
                        <th>Morts</th>
                        <th>Assists</th>
                        <th>Agent</th>
                        <th>Carte</th>
                    </tr>
                </thead>
                <tbody id="stats-table-body">
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Valorant. Tous droits réservés.</p>
    </footer>

    <script src="script.js"></script>
    <script src="afficher_donnees.js"></script>
</body>
</html>
